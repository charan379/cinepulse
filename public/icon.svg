<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Solid Dark Slate Base -->
  <rect width="512" height="512" rx="64" fill="#0f172a" />
  
  <!-- Subtle 1px Border -->
  <rect x="2" y="2" width="508" height="508" rx="62" stroke="#334155" stroke-width="4" fill="none" />

  <!-- Film Reel Disc in White/Navy -->
  <g transform="translate(180, 110)">
    <circle cx="120" cy="120" r="105" fill="#0f172a" stroke="#ffffff" stroke-width="16" />
    <circle cx="120" cy="120" r="30" fill="#ffffff" />
    <circle cx="75" cy="80" r="16" fill="#ffffff" />
    <circle cx="165" cy="80" r="16" fill="#ffffff" />
    <circle cx="120" cy="170" r="16" fill="#ffffff" />
    <circle cx="75" cy="150" r="14" fill="#ffffff" />
    <circle cx="165" cy="150" r="14" fill="#ffffff" />
    <path d="M210 215 C190 235 150 235 150 235 L120 235" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Solid Cinema Play Triangle Frame -->
  <path d="M140 145 L320 256 L140 367 Z" fill="#0f172a" stroke="#ffffff" stroke-width="20" stroke-linejoin="round" />
  <path d="M175 190 L275 256 L175 322 Z" fill="#ffffff" />

  <!-- Dynamic Electric Blue Pulse Wave (CinePulse signature) -->
  <path d="M60 256 L130 256 L160 200 L195 320 L230 110 L265 400 L300 210 L335 290 L365 240 L400 256 L452 256" 
        stroke="#007bff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Secondary Glow Dots on Pulse Peaks -->
  <circle cx="230" cy="110" r="8" fill="#38bdf8" />
  <circle cx="265" cy="400" r="8" fill="#38bdf8" />
</svg>
